# S3 connector integration: a MinIO server backs a virtual file; a file received by the node is
# uploaded to S3 and can be read back from S3.
services:
  minio:
    image: minio/minio:latest
    container_name: minio
    command: ["server", "/data"]
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    networks: [s3-net]
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s

  createbucket:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    networks: [s3-net]
    entrypoint: ["/bin/sh", "-c", "until mc alias set m http://minio:9000 minioadmin minioadmin; do sleep 1; done; mc mb -p m/pesit; echo bucket-ready"]

  pw-node:
    build: { context: ../cx/pw-node }
    container_name: pw-node
    environment:
      - PESIT_API_KEY=integration-test-key
    ports: ["8090:8080", "9090:9081"]
    networks: [s3-net]
    depends_on: { minio: { condition: service_healthy } }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 2s

networks:
  s3-net: { driver: bridge }
