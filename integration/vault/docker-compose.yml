# Native HashiCorp Vault PKI integration test: a dev-mode Vault issues certificates for the node.
services:
  vault:
    image: hashicorp/vault:1.18
    container_name: vault
    command: ["server", "-dev"]
    environment:
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
    cap_add: [IPC_LOCK]
    networks: [pki-net]
    healthcheck:
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  pw-node:
    build:
      context: ../cx/pw-node
    container_name: pw-node
    environment:
      - PESIT_API_KEY=integration-test-key
    networks: [pki-net]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 3s

  test-runner:
    image: ubuntu:22.04
    container_name: vault-test-runner
    volumes:
      - ./tests:/tests:ro
    networks: [pki-net]
    depends_on:
      vault:
        condition: service_healthy
      pw-node:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/tests/run-vault-tests.sh"]

networks:
  pki-net:
    driver: bridge
